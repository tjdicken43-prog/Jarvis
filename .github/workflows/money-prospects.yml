name: money-prospects
on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 4am Central (3am in winter), before the 5:47 Money agent
  workflow_dispatch:
    inputs:
      limit:
        description: "Audit at most N websites (0 = all)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: money-data-prospects
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: money/ci/data-branch.sh open
      - run: pip install --quiet duckdb
      - run: python3 money/prospects/overture.py data/prospects
        continue-on-error: true
      - run: python3 money/prospects/scan.py --out data/prospects --limit "${{ github.event.inputs.limit || '0' }}"
      - run: python3 money/prospects/coldlist.py data/prospects/nwa.json data/prospects
      - run: 'money/ci/data-branch.sh save "prospects: NWA scan $(date -u +%F)"'
