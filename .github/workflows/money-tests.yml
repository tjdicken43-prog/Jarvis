name: money-tests
on:
  push:  # main only: a branch with a PR is already tested by pull_request (saves Actions minutes)
    branches: [main]
    paths: ["money/**", ".github/workflows/money-*.yml"]
  pull_request:
    paths: ["money/**", ".github/workflows/money-*.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 money/test/test_paper.py
      - run: python3 money/test/test_scan.py
      - run: python3 money/test/test_overture.py
      - run: python3 money/test/test_coldlist.py
      - run: python3 money/test/test_agency_import.py
      - run: python3 money/test/test_trade_build.py
      - run: python3 money/test/test_care.py
      - run: python3 money/test/test_audit.py
      - run: python3 money/test/test_budget.py
      - run: python3 money/test/test_tax.py
      - run: python3 money/test/test_apify_actor.py
      - run: python3 money/test/test_addons.py
      - run: node money/test/test_trade_tools.js
      - run: python3 money/sites/build.py
  agency-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: agency_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r money/agency/api/requirements.txt httpx==0.28.1
      - run: python3 money/agency/api/tests/test_api.py
        env: {TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/agency_test"}
      - run: python3 money/agency/api/tests/test_quality.py
        env: {TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/agency_test"}
      - run: python3 money/agency/api/tests/test_frontdesk.py
        env: {TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/agency_test"}
      - run: python3 money/agency/api/tests/test_pro.py
        env: {TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/agency_test"}
      - run: python3 money/agency/api/evals/run.py   # frozen test set: real shops, TJ's corrections, made-up traps
