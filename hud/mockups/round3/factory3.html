WINGS.forEach((wg, wi) => {
  const RW = 3.6, RD = 3.4, n = wg.fighters.length, rows = Math.ceil(n / wg.cols), ox = wg.at[0] - (wg.cols - 1) * RW / 2, oz = wg.at[1] - (rows - 1) * RD / 2;
  const wm = new THREE.MeshStandardMaterial({ color: wg.wall, roughness: .8 }), tm = new THREE.MeshStandardMaterial({ color: wg.trim, roughness: .6 });
  box(wg.cols * RW + .8, .25, rows * RD + .8, wg.roof, wg.at[0], .12, wg.at[1]);
  wg.fighters.forEach((F, i) => {
    const nm = F.name, cx = ox + (i % wg.cols) * RW, cz = oz + Math.floor(i / wg.cols) * RD, fk = ROOMF[nm] || wg.floor;
    box(RW - .2, .1, RD - .2, new THREE.MeshStandardMaterial({ map: paint(fk, FLOOR[fk]), roughness: .9 }), cx, .3, cz);
    const hB = 1.7, hF = .3;
    box(RW - .1, hB, .14, wm, cx, .35 + hB / 2, cz - RD / 2 + .07); box(RW - .1, .08, .2, tm, cx, .35 + hB, cz - RD / 2 + .07);
    box(.14, hB, RD - .1, wm, cx - RW / 2 + .07, .35 + hB / 2, cz); box(.2, .08, RD - .1, tm, cx - RW / 2 + .07, .35 + hB, cz);
    box(RW - .1, hF, .12, wm, cx, .35 + hF / 2, cz + RD / 2 - .06); box(.12, hF, RD * .45, wm, cx + RW / 2 - .06, .35 + hF / 2, cz - RD * .27);
    // the deck: where this fighter is right now, and the dummy's counter to it
    const fd = deck(F.moves, hash(nm)), dd = deck(F.dummy.moves, hash(nm) + 1), k = (T0 + hash(nm)) % (fd.length + 3);
    const peak = i === (hash(wg.id) + 3) % n;        // one room per wing is mid-peak: the deck ran out, so the form and ultimate come out
    const mv = peak ? F.peak.move : fd[k % fd.length], dm = dd[(k + hash(nm)) % dd.length];
    const st = F.status === "live" ? "#7be0a0" : F.status === "built" ? "#ffd27a" : "#8a96a0";
    box(.22, .06, .22, new THREE.MeshBasicMaterial({ color: st, toneMapped: false }), cx + RW / 2 - .35, .4, cz + RD / 2 - .35);
    const c = F.colors, f = pose(fighter({ top: c.top, pants: c.pants, skin: "#f2cfaa", hair: c.hair, sleeve: c.top, seed: i + wi * 13, hairN: 14, hairLen: .16, bangs: 3, up: /Gojo|Sasuke|Goku|Vegeta|Naruto|Minato|Trunks/.test(nm) }), peak ? POSE.purple : MOVES[hash(nm) % MOVES.length]);
    f.position.set(cx - .6, .35, cz + .2); f.rotation.y = Math.PI / 2; f.scale.setScalar(.78); scene.add(f);
    const d = pose(fighter({ top: "#c49a5e", pants: "#a87c45", skin: "#d7b177", hair: "#b48a52", seed: 5, belt: "#4a3420" }), DPOSE[(i * 2 + wi) % DPOSE.length]);
    d.position.set(cx + .65, .35, cz + .2); d.rotation.y = -Math.PI / 2; d.scale.setScalar(.76); scene.add(d);
    if (peak) { const glow = new THREE.PointLight(wg.accent, 6, 3.4, 1.4); glow.position.set(cx - .3, 1.3, cz + .2); scene.add(glow);
      const aura = new THREE.Mesh(new THREE.SphereGeometry(.55, 20, 12), new THREE.MeshBasicMaterial({ color: wg.accent, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })); aura.scale.set(1, 1.8, 1); aura.position.set(cx - .6, 1.05, cz + .2); scene.add(aura); }
    ROOMS.push({ F, wg, cx, cz, mv, dm, peak, k, fd });
    feed.push({ nm, mv, q: peak ? F.peak.quip : F.quips[k % F.quips.length], peak, wing: wg.id });
    if (focus === wg.id) lab("tagn", `${nm}<small>${F.job.split(" (")[0].slice(0, 30)}</small>`, new THREE.Vector3(cx, .4, cz + RD / 2 - .1));
    if ((focus === wg.id && (peak || i % 3 === 0)) || (!focus && peak && !phone)) lab("bub", `${nm} · ${mv}<small>“${peak ? F.peak.quip : F.quips[k % F.quips.length]}”</small>`, new THREE.Vector3(cx - .6, 2.3, cz + .2));
  });
  const sub = `${wg.building} · ${n} fighters`;
  lab("sign", `<span class="jp">${wg.jp}</span><b>${wg.name}</b><small>${sub}</small>`, new THREE.Vector3(wg.at[0], .4, wg.at[1] + (rows * RD) / 2 + 1.4));
});
// focus: zoom the orthographic camera onto one wing
if (focus) { const w = WINGS.find(w => w.id === focus), rows = Math.ceil(w.fighters.length / w.cols), ext = Math.max(w.cols * 3.6, rows * 3.4 * 1.6);
  const z = ext * (phone ? .9 : .42); Object.assign(camera, { left: -z * asp, right: z * asp, top: z, bottom: -z }); camera.position.set(w.at[0] + 30, 30, w.at[1] + 30); camera.lookAt(w.at[0] + (phone ? 0 : 3), 0, w.at[1] + .6); camera.updateProjectionMatrix(); camera.updateMatrixWorld(); }
else { const z = phone ? 26 : 18.5; Object.assign(camera, { left: -z * asp, right: z * asp, top: z, bottom: -z }); camera.position.set(30, 30, 30); camera.lookAt(2.5, 0, -2); camera.updateProjectionMatrix(); camera.updateMatrixWorld(); }
// feed: peaks first, then a spread across wings
const fe = document.getElementById("feed"); const order = [...feed.filter(x => x.peak), ...feed.filter(x => !x.peak)].filter(x => !focus || x.wing === focus).slice(0, focus ? 6 : 5);
fe.innerHTML = "<h3>Live</h3>" + order.map(x => `<div><b>${x.nm}</b> ${x.peak ? "went all out:" : "used"} ${x.mv} · <i>"${x.q}"</i></div>`).join("");
// move deck panel for one fighter
{ const r = ROOMS.find(r => r.F.name === pick) || ROOMS[0], F = r.F, k = r.k % r.fd.length;
  document.getElementById("deck").innerHTML = `<h3>${F.name}</h3><div class="job">${F.job} · ${F.status}</div>
  <h4>Move deck · ${k + 1} of ${r.fd.length} · no repeats till it runs out</h4><ol start="${Math.max(1, k - 1)}">${r.fd.map((m, i) => `<li class="${i < k ? "done" : i === k ? "now" : ""}" ${i < k - 2 ? "hidden" : ""}>${m}</li>`).join("")}</ol>
  <h4>Then the peak</h4><div class="pk">${F.peak.form} → ${F.peak.move}</div><div class="q">“${F.peak.quip}”</div>
  <h4>Forms unlocked in order</h4><div>${F.forms.join(" → ") || "none in the show"}</div>
  <h4>Dummy: ${F.dummy.name}</h4><div>${F.dummy.moves.join(" · ")}</div>`; }

const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .35, .4, .92)); composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(W, H) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 res; varying vec2 vUv;
    void main(){ float b=smoothstep(.2,.55,abs(vUv.y-.5))*2.4; vec4 c=vec4(0.); float w=0.;
      for(int x=-2;x<=2;x++) for(int y=-2;y<=2;y++){ float k=exp(-float(x*x+y*y)/4.); c+=texture2D(tDiffuse,vUv+vec2(x,y)*b/res)*k; w+=k; }
      vec3 o=c.rgb/w; vec2 d=vUv-.5; o*=1.-dot(d,d)*.8; o=mix(o,o*vec3(1.04,1.,.95),.5); gl_FragColor=vec4(o,1.); }` }));
composer.render();
const v = new THREE.Vector3(); for (const { e, p } of L) { v.copy(p).project(camera); e.style.left = (v.x + 1) / 2 * W + "px"; e.style.top = (1 - v.y) / 2 * H + "px"; }
document.title = "ready";
</script></body></html>
